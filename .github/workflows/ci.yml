name: CI

on:
  # Branch pushes are checked through their pull request, which runs against the
  # merge commit; running the push event there too would duplicate every check.
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The published packages declare `engines.node >= 22`; the gate runs on
    # every major that promise covers.
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci
      - run: npm run check-types
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run coverage
      - run: npm run docs:api
      - run: npm run csp:check
      # Publication-artifact gate: dist builds + offline tarball install
      # (pack:check runs the build itself; nothing contacts a registry).
      - run: npm run pack:check
      - run: FUZZ_BUDGET=5000 npm run fuzz
      - run: FUZZ_LIST=1 FUZZ_BUDGET=5000 npm run fuzz
      - run: FUZZ_ANNOTATIONS=1 FUZZ_BUDGET=5000 npm run fuzz
      - run: FUZZ_DIALECT=draft7 FUZZ_BUDGET=3000 npm run fuzz
      - run: FUZZ_DIALECT=draft7 FUZZ_LIST=1 FUZZ_BUDGET=3000 npm run fuzz
      - run: FUZZ_DIALECT=draft6 FUZZ_LIST=1 FUZZ_BUDGET=3000 npm run fuzz
      - run: FUZZ_DIALECT=draft2019-09 FUZZ_LIST=1 FUZZ_BUDGET=3000 npm run fuzz
      - run: FUZZ_DIALECT=draft4 FUZZ_LIST=1 FUZZ_BUDGET=3000 npm run fuzz
      - run: npx tsx packages/ajv-compat/test/oracle/capture.ts
      - run: npx tsx packages/ajv-compat/test/oracle/capture-companions.ts
      - run: npx tsx packages/ajv-compat/test/oracle/capture-mutation.ts
      - run: npx tsx packages/ajv-compat/test/oracle/capture-lifecycle.ts
      # capture writes plain JSON.stringify; format before diffing so the
      # check reflects real oracle drift, not indentation churn.
      - run: npx prettier --write packages/ajv-compat/test/fixtures/*.json
      - run: git diff --exit-code packages/ajv-compat/test/fixtures/
      - run: test -z "$(git status --porcelain)"

  # Report-only benchmark reproducibility run (ANALYSIS §9 harness): no
  # thresholds — shared-runner variance makes CI perf gates noisy (the
  # enforced gate is the local spike bench). A crash still fails the job.
  bench-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci
      - run: set -o pipefail; BENCH_BUDGET=50 npm run bench:harness | tee bench-table.txt

      - uses: actions/upload-artifact@v7
        with:
          name: bench-results
          path: |
            bench/results/results.json
            bench-table.txt

  # Conformance through Bowtie's own runner (exact per-dialect pins, zero
  # failures). Everything stays local to the runner: the harness image is
  # built here and never pushed; no results are submitted anywhere
  # (bowtie.report listing is the separate, owner-gated submission step).
  bowtie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Version-pinned to the locally verified bowtie release.
      # pipx's own runtime defaults to the runner image's baked-in python,
      # not whatever setup-python put on PATH, so it must be told explicitly.
      - run: pipx install --python "$(which python3.13)" bowtie-json-schema==2026.6.1

      - run: npm ci
      - run: npm run bowtie
