# Dependency-update automation.
#
# Security fixes arrive as immediate, individual PRs via Dependabot *security updates* — a separate,
# event-driven flow that is NOT governed by the schedule below and is left ungrouped on purpose. (That flow
# must be enabled once in the repo settings: Settings -> Code security -> "Dependabot security updates".)
#
# Everything else is a *version update*: run weekly and collapsed into a single catch-all group per ecosystem,
# so routine bumps land as at most one PR per ecosystem per week (npm and GitHub Actions can't share a PR).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # TypeScript 7 replaces the in-process compiler API that typedoc and
      # typescript-eslint depend on; both target TypeScript 7.1's stable API.
      # Remove this entry once both declare TS 7 support, then adopt TS 7 as a
      # deliberate change rather than a routine bump.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-all:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-all:
        applies-to: version-updates
        patterns:
          - "*"
